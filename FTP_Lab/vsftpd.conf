# vsftpd config for FTP Learning Lab

# Run standalone listener
listen=YES
listen_ipv6=NO

# Anonymous FTP Settings
anonymous_enable=YES
anon_root=/var/ftp/anon
no_anon_password=YES
anon_upload_enable=YES
anon_mkdir_write_enable=YES
anon_other_write_enable=YES
anon_world_readable_only=NO

# Local User Settings
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
chroot_local_user=YES
allow_writeable_chroot=YES
check_shell=NO
pam_service_name=vsftpd

# Logging Settings
xferlog_enable=YES
xferlog_std_format=YES
vsftpd_log_file=/var/log/vsftpd.log
dual_log_enable=YES

# Passive Mode Ports (Mapped in Docker)
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=127.0.0.1

# Disable seccomp sandbox for Docker compatibility
seccomp_sandbox=NO
